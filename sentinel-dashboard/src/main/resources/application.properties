#spring settings
server.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

#cookie name setting
server.servlet.session.cookie.name=sentinel_dashboard_cookie

#spring
spring.config.import=optional:configtree:/run/secrets/

#logging settings
logging.level.org.springframework.web=INFO
logging.file.name=${user.home}/logs/csp/sentinel-dashboard.log
logging.pattern.file= %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
#logging.pattern.console= %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

#auth settings
auth.filter.exclude-urls=/,/auth/login,/auth/logout,/registry/machine,/version
auth.filter.exclude-url-suffixes=htm,html,js,css,map,ico,ttf,woff,png
# If auth.enabled=false, Sentinel console disable login
auth.username=sentinel
auth.password=sentinel

# Inject the dashboard version. It's required to enable
# filtering in pom.xml for this resource file.
sentinel.dashboard.version=@project.version@

#sentinel.nacos.serverAddr=localhost:8848
#sentinel.nacos.username=nacos
#sentinel.nacos.password=nacos
#sentinel.nacos.namespace=ffcs-test
#sentinel.nacos.groupId=DEFAULT_GROUP
#sentinel.nacos.dataId=ffcs-admin-flow-rules.json

# nacos settings
# NACOS_ADDRESS / NACOS_NAMESPACE / NACOS_USERNAME / NACOS_PASSWORD / NACOS_GROUP_ID
nacos.address=${NACOS_ADDRESS:photoframe-nacos:8848}
nacos.namespace=${NACOS_NAMESPACE:photoframe-prod}
nacos.username=${NACOS_USERNAME:nacos}
nacos.password=${nacos-password:${NACOS_PASSWORD:}}
nacos.groupId=${NACOS_GROUP_ID:DEFAULT_GROUP_YML}
